version: '3.8'

services:
  # Broker Apache Kafka en mode KRaft (moderne, pas besoin de ZooKeeper)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - fraud-network

  # Création automatique du topic avec 3 partitions pour le parallélisme
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: [ "sh", "-c" ]
    command: |
      "
       # Attendre que Kafka soit prêt
       echo -e 'Attente de Kafka...'
       kafka-topics --bootstrap-server kafka:29092 --list

       echo -e 'Création du topic financial-transactions'
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic financial-transactions --replication-factor 1 --partitions 3

       echo -e 'Topics créés :'
       kafka-topics --bootstrap-server kafka:29092 --list
       "
    networks:
      - fraud-network

  # Redis Feature Store (pour le temps réel < 2ms)
  redis:
    image: redis:7-alpine
    container_name: redis-feature-store
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fraud-network

volumes:
  kafka_data:
  redis_data:

networks:
  fraud-network:
    driver: bridge